# Canonical Dependabot configuration - identical across all repositories and branches.
# Managed by gvatsal60/.github; keep in sync when the supported ecosystem list changes.
# Supported ecosystems reference:
# https://docs.github.com/en/code-security/reference/supply-chain-security/supported-ecosystems-and-repositories
# All configuration options reference:
# https://docs.github.com/en/code-security/reference/dependabot-options-reference
